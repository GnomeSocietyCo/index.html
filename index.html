<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Loading...</title>
<!--
    METAL GEAR SOLID — SERVER LOADING SCREEN

    SETUP
      1. Upload this file (as index.html) to any web host. GitHub Pages is free
         and works fine.
      2. Point your server at it in garrysmod/cfg/server.cfg:
             sv_loadingurl "http://yoursite.com/loading/"
         or as a startup parameter (note the +):
             +sv_loadingurl "http://yoursite.com/loading/"
      3. Restart the server.

    HTTP vs HTTPS
      GMod's embedded browser is an old Chromium build and can fail on HTTPS.
      If the screen shows blank, serve over plain HTTP. On GitHub Pages that
      means adding a custom domain so "Enforce HTTPS" can be switched off.

    COMPATIBILITY
      Written for that old browser on purpose: ES5 only (no arrow functions,
      template literals, const/let), no flexbox gap, no CSS grid, no external
      scripts or fonts. Anything more modern risks a blank screen with no way
      to debug it from inside the game.

    OPTIONAL FONT
      Drop MGS2MENU.TTF next to this file and the @font-face below picks it up.
      Without it, it falls back to a monospace stack and still looks right.
-->
<style>
@font-face {
    font-family: 'MGSMenu';
    src: url('MGS2MENU.TTF') format('truetype');
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #000;
    color: #b8ffc8;
    font-family: 'MGSMenu', 'Lucida Console', Monaco, monospace;
    overflow: hidden;
    height: 100%;
    width: 100%;
}

/* Scanline overlay and a slow vertical sweep, for the codec look. */
#scanlines {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: -webkit-linear-gradient(
        top,
        rgba(0,0,0,0) 50%,
        rgba(0,0,0,0.35) 51%
    );
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 100;
}

#sweep {
    position: fixed;
    left: 0; right: 0;
    height: 120px;
    background: -webkit-linear-gradient(
        top,
        rgba(120,255,160,0) 0%,
        rgba(120,255,160,0.05) 50%,
        rgba(120,255,160,0) 100%
    );
    pointer-events: none;
    z-index: 99;
    -webkit-animation: sweep 6s linear infinite;
}
@-webkit-keyframes sweep {
    0%   { top: -120px; }
    100% { top: 100%; }
}

#vignette {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: -webkit-radial-gradient(
        center, ellipse,
        rgba(0,0,0,0) 40%,
        rgba(0,0,0,0.85) 100%
    );
    pointer-events: none;
    z-index: 98;
}

#wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 900px;
    margin-left: -450px;
    margin-top: -240px;
    z-index: 10;
}

/* Framed panel with corner ticks, matching the in-game HUD. */
#panel {
    position: relative;
    border: 1px solid rgba(180,255,200,0.35);
    background: rgba(0,20,8,0.6);
    padding: 34px 40px 40px 40px;
}
.corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: #b8ffc8;
    border-style: solid;
    border-width: 0;
}
.tl { top: -1px; left: -1px;  border-top-width: 2px; border-left-width: 2px; }
.tr { top: -1px; right: -1px; border-top-width: 2px; border-right-width: 2px; }
.bl { bottom: -1px; left: -1px;  border-bottom-width: 2px; border-left-width: 2px; }
.br { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

#tag {
    font-size: 12px;
    letter-spacing: 6px;
    color: #4ad07a;
    margin-bottom: 10px;
}

#servername {
    font-size: 34px;
    letter-spacing: 3px;
    color: #eafff0;
    margin-bottom: 26px;
    text-shadow: 0 0 12px rgba(120,255,160,0.35);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Two-column detail rows */
.row { margin-bottom: 9px; font-size: 14px; letter-spacing: 2px; }
.key {
    display: inline-block;
    width: 150px;
    color: #4ad07a;
}
.val { color: #dfffe8; }

#barwrap {
    margin-top: 30px;
    border: 1px solid rgba(180,255,200,0.35);
    height: 20px;
    position: relative;
    background: rgba(0,0,0,0.6);
}
#bar {
    height: 100%;
    width: 0%;
    background: #3ee07a;
    box-shadow: 0 0 14px rgba(62,224,122,0.7);
}
/* Segment ticks over the bar, like the in-game health bar */
#segments {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
}
#segments div {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: rgba(0,0,0,0.55);
}

#status {
    margin-top: 12px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #8fe0a8;
    height: 16px;
    white-space: nowrap;
    overflow: hidden;
}

#pct {
    position: absolute;
    right: 0;
    top: -20px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #4ad07a;
}

#blink { -webkit-animation: blink 1.1s steps(2, start) infinite; }
@-webkit-keyframes blink { to { visibility: hidden; } }
</style>
</head>
<body>

<div id="scanlines"></div>
<div id="sweep"></div>
<div id="vignette"></div>

<div id="wrap">
  <div id="panel">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="tag">TACTICAL ESPIONAGE ACTION</div>
    <div id="servername">CONNECTING</div>

    <div class="row"><span class="key">MISSION AREA</span><span class="val" id="mapname">---</span></div>
    <div class="row"><span class="key">OPERATION</span><span class="val" id="gamemode">---</span></div>
    <div class="row"><span class="key">CAPACITY</span><span class="val" id="maxplayers">---</span></div>

    <div style="position:relative;">
      <div id="pct">0%</div>
      <div id="barwrap">
        <div id="bar"></div>
        <div id="segments"></div>
      </div>
    </div>

    <div id="status">ESTABLISHING UPLINK<span id="blink">_</span></div>
  </div>
</div>

<script>
// ES5 only — see the compatibility note at the top of this file.

var totalFiles  = 0;
var neededFiles = 0;
var doneFiles   = 0;

function $(id) { return document.getElementById(id); }

function setText(id, text) {
    var el = $(id);
    if (el) { el.innerHTML = String(text); }
}

// Draw the segment ticks over the progress bar.
(function buildSegments() {
    var seg = $('segments');
    for (var i = 1; i < 10; i++) {
        var d = document.createElement('div');
        d.style.left = (i * 10) + '%';
        seg.appendChild(d);
    }
})();

function setProgress(fraction) {
    if (fraction < 0) { fraction = 0; }
    if (fraction > 1) { fraction = 1; }

    var pct = Math.floor(fraction * 100);
    $('bar').style.width = pct + '%';
    setText('pct', pct + '%');
}

function refreshProgress() {
    if (neededFiles > 0) {
        setProgress(doneFiles / neededFiles);
    } else if (totalFiles > 0) {
        setProgress(1);
    }
}

/* ------------------------------------------------------------------
   Functions below are called BY Garry's Mod. Names must match exactly.
   ------------------------------------------------------------------ */

// Fired once at the start with the server's details.
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode, volume, language) {
    setText('servername', servername || 'UNKNOWN SERVER');
    setText('mapname',    mapname    || '---');
    setText('gamemode',   gamemode   || '---');
    setText('maxplayers', (maxplayers || '?') + ' OPERATIVES');
}

// Total number of files the client may need.
function SetFilesTotal(total) {
    totalFiles = total || 0;
    refreshProgress();
}

// How many actually need downloading.
function SetFilesNeeded(needed) {
    neededFiles = needed || 0;
    doneFiles = 0;
    refreshProgress();
}

// Called per file as it downloads.
function DownloadingFile(filename) {
    doneFiles++;
    refreshProgress();

    // Trim long workshop paths down to the filename.
    var name = String(filename || '');
    var slash = name.lastIndexOf('/');
    if (slash >= 0) { name = name.substring(slash + 1); }
    if (name.length > 60) { name = name.substring(0, 57) + '...'; }

    setText('status', 'RECEIVING: ' + name.toUpperCase());
}

// General status messages from the engine.
function SetStatusChanged(status) {
    setText('status', String(status || '').toUpperCase() +
        '<span id="blink">_</span>');
}
</script>

</body>
</html>
